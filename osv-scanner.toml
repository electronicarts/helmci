[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "No patched 0.10.x release exists; block-buffer 0.10.4 is required by digest 0.10.7 through aws-config and sha256. Reassess when upstream releases a compatible fix."

[[PackageOverrides]]
name = "rustls-webpki"
version = "0.101.7"
ecosystem = "crates.io"
vulnerability.ignore = true
reason = "Transitive dependency pinned by AWS SDK (aws-smithy-http-client -> hyper-rustls -> rustls 0.21). Not fixable from this crate."

[[PackageOverrides]]
name = "proc-macro-error2"
version = "2.0.1"
ecosystem = "crates.io"
vulnerability.ignore = true
reason = "RUSTSEC-2026-0173: unmaintained advisory, no patched version exists. Used only at compile time (proc-macro) by getset (via oci-spec -> oci-client) and tabled_derive (via tabled). No runtime security impact."

[[PackageOverrides]]
name = "unsafe-libyaml"
version = "0.2.11"
ecosystem = "crates.io"
vulnerability.ignore = true
reason = "RUSTSEC-2024-0449: unmaintained advisory, no patched version exists. Transitive dependency of serde_yaml_ng."
